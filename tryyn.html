<!DOCTYPE html>
<html>
<head>
    <title>Vue.js Pet Depot</title>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

<div id="app">

    <header>
        <h1 v-text="sitename"></h1>

        <button v-on:click="showCheckout">
            {{ cartItemCount }}
            <span class="fas fa-shopping-cart"></span>
            Checkout
        </button>

    </header>

    <main>

        <!-- Product -->
        <div v-if="showProduct">

            <figure>
                <img v-bind:src="product.image" alt="Cat Food">
            </figure>

            <h2 v-text="product.title"></h2>

            <p v-html="product.description"></p>

            <p>Price: {{ product.price }}</p>

            <p>
                Available stock: {{ product.availableInventory }}
            </p>

            <button
                v-on:click="addToCart"
                v-if="canAddToCart">
                Add to cart
            </button>

            <button
                disabled
                v-else>
                Add to Cart
            </button>

        </div>


        <!-- Checkout -->
        <div v-else>

            <h2>Checkout</h2>

            <p>
                <strong>First Name:</strong>
                <input v-model="order.firstName">
            </p>

            <p>
                <strong>Last Name:</strong>
                <input v-model="order.lastName">
            </p>

            <h2>Order Information</h2>

            <p>First Name: {{ order.firstName }}</p>
            <p>Last Name: {{ order.lastName }}</p>

            <p>
                <strong>Address:</strong>
                <input v-model="order.address">
            </p>

            <p>
                <strong>City:</strong>
                <input v-model="order.city">
            </p>

                <strong>Zip/Postal Code:</strong>
                <input v-model="order.zip">
            </p>
            <select v-model="order.state">
                <option disabled value="">State</option>
                <option v-for="(state, key) in states"
                v-bind:value="state">
                {{key}}
            </option>
        </select>
            <ol>
                <li v-for="state in states">{{state}}</li>
            </ol>

                 <input
                    type="checkbox"
                    id="gift"
                    value="true"
                    v-model="order.gift"
                    v-bind:true-value="order.sendGift"
                    v-bind:false-value="order.dontSendGift">
            </p>        
            <p>
                <input
                    type="radio"
                    id="home"
                    value="Home"
                    v-model="order.method">

                <label for="home">Home</label>

                <input
                    type="radio"
                    id="business"
                    value="Business"
                    v-model="order.method">

                <label for="business">Business</label>
            </p>
            <button v-on:click="submitForm">Place Order</button>
        </div>
    </main>

</div>


<script type="text/javascript">

var webstore = new Vue({

    el: '#app',

    data: {

        sitename: 'Vue.js Pet Depot',

        showProduct: true,

        product: {
            id: 1001,
            title: "Cat Food, 25lb bag",
            description: "A 25 pound bag of irresistible organic goodness for your cat.",
            price: 2000,
            image: "images/pet.png",
            availableInventory: 5
        },

        cart: [],

        order: {
            firstName: '',
            lastName: '',
            address: '',
            city: '',
            states: ['Alabama','Alaska','Arizona', 'California', 'Nevada'],
            zip: '',
            method: 'Home',
            sendGift: 'send as a gift',
            dontSendGift:'Do not send as a gift'
        }
    },

    methods: {

        addToCart: function () {
            this.cart.push(this.product.id);
        },

        showCheckout: function () {
            this.showProduct = !this.showProduct;
        },

        submitForm() {
            alert('Order submitted!')
        }

    },

    computed: {

        cartItemCount: function () {
            return this.cart.length || "";
        },

        canAddToCart: function () {
            return this.product.availableInventory > this.cart.length;
        }

    }

});

</script>

</body>
</html>
